"""
Клиент страховой компании
"""
type Client {
  """
  Уникальный идентификатор клиента
  """
  id: ID!

  """
  Полное имя клиента
  """
  name: String!

  """
  Возраст клиента
  """
  age: Int!

  """
  Список документов клиента
  Поддерживает фильтрацию и пагинацию
  """
  documents(
    """Фильтр по типу документа (паспорт, водительское удостоверение и т.д.)"""
    type: String
    """Количество документов для возврата"""
    limit: Int
    """Смещение для пагинации"""
    offset: Int
  ): [Document!]!

  """
  Список родственников клиента
  Поддерживает фильтрацию по типу родства
  """
  relatives(
    """Фильтр по типу родства"""
    relationType: String
    """Количество родственников для возврата"""
    limit: Int
    """Смещение для пагинации"""
    offset: Int
  ): [Relative!]!
}

"""
Документ клиента (паспорт, водительское удостоверение и т.д.)
"""
type Document {
  """
  Уникальный идентификатор документа
  """
  id: ID!

  """
  Тип документа
  """
  type: String!

  """
  Номер документа
  """
  number: String!

  """
  Дата выдачи документа
  """
  issueDate: String!

  """
  Дата окончания срока действия документа
  """
  expiryDate: String

  """
  Клиент, которому принадлежит документ
  """
  client: Client!
}

"""
Родственник клиента
"""
type Relative {
  """
  Уникальный идентификатор родственника
  """
  id: ID!

  """
  Тип родства
  """
  relationType: String!

  """
  Полное имя родственника
  """
  name: String!

  """
  Возраст родственника
  """
  age: Int!

  """
  Клиент, с которым связан этот родственник
  """
  client: Client!
}

"""
Результат поиска клиентов с пагинацией
"""
type ClientConnection {
  """
  Список клиентов
  """
  nodes: [Client!]!

  """
  Общее количество клиентов, удовлетворяющих критериям поиска
  """
  totalCount: Int!

  """
  Информация о пагинации
  """
  pageInfo: PageInfo!
}

"""
Информация о пагинации
"""
type PageInfo {
  """
  Есть ли следующая страница
  """
  hasNextPage: Boolean!

  """
  Есть ли предыдущая страница
  """
  hasPreviousPage: Boolean!
}

"""
Корневой тип запросов
"""
type Query {
  """
  Получить клиента по ID
  """
  client(id: ID!): Client

  """
  Получить список клиентов с фильтрацией и пагинацией
  """
  clients(
    """Количество клиентов для возврата (по умолчанию: 10)"""
    limit: Int = 10
    """Смещение для пагинации (по умолчанию: 0)"""
    offset: Int = 0
    """Фильтр по имени клиента"""
    name: String
    """Фильтр по минимальному возрасту"""
    minAge: Int
    """Фильтр по максимальному возрасту"""
    maxAge: Int
  ): ClientConnection!

  """
  Получить документ по ID
  """
  document(id: ID!): Document

  """
  Получить родственника по ID
  """
  relative(id: ID!): Relative
}
